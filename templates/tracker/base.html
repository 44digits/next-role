{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Next Role{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tracker/app.css' %}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{% url 'board' %}">Next Role</a>
      {% if request.user.is_authenticated %}
        <nav aria-label="Main navigation">
          <a href="{% url 'board' %}">Jobs</a>
          <a href="{% url 'company_list' %}">Companies</a>
          <a href="{% url 'contact_list' %}">Contacts</a>
          <a href="{% url 'reports' %}">Reports</a>
          <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button class="nav-button" type="submit">Sign out</button>
          </form>
        </nav>
      {% endif %}
    </header>
    <main class="page">
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
