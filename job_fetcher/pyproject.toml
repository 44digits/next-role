[project]
name = "job-fetcher"
version = "0.1.0"
description = "Scheduled job posting fetcher"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
