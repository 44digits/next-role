[project]
name = "next-role"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "gunicorn>=23,<24",
    "pdfplumber>=0.11,<1",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
