services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-next_role}
      POSTGRES_USER: ${DB_USER:-next_role}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "/opt/venv/bin/python manage.py migrate && exec /opt/venv/bin/python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-next_role}
      DB_USER: ${DB_USER:-next_role}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      DB_PORT: 5432
      DJANGO_MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data/media:/app/media
